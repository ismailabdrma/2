<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Sign Up</mat-card-title>
      <mat-card-subtitle>Create your new account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required>
          <mat-error *ngIf="signupForm.get('username')?.hasError('required') && signupForm.get('username')?.touched">
            Username is required
          </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" required>
          <mat-error *ngIf="signupForm.get('email')?.hasError('required') && signupForm.get('email')?.touched">
            Email is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('email')?.hasError('email') && signupForm.get('email')?.touched">
            Please enter a valid email
          </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-error *ngIf="signupForm.get('password')?.hasError('required') && signupForm.get('password')?.touched">
            Password is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('password')?.hasError('minlength') && signupForm.get('password')?.touched">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="signupForm.invalid">
          Sign Up
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/auth/login">Already have an account? Login</a>
    </mat-card-actions>
  </mat-card>
</div>
