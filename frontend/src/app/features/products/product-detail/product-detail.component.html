<div class="product-detail-container">
  <mat-card *ngIf="product; else loadingOrError" class="product-detail-card">
    <mat-card-header>
      <mat-card-title>{{ product.name }}</mat-card-title>
      <mat-card-subtitle>{{ product.categoryName }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="product-image-gallery">
        <img [src]="mainImageUrl || '/placeholder.svg?height=400&width=400&text=Product Image'" alt="{{ product.name }}" class="main-image" />
        <div class="thumbnail-gallery">
          <img *ngFor="let url of product.imageUrls" [src]="url" alt="Thumbnail"
               [class.active]="url === mainImageUrl" (click)="setMainImage(url)" />
        </div>
      </div>

      <div class="product-info">
        <p class="description">{{ product.description }}</p>
        <p class="price">{{ product.displayedPrice | currency }}</p>
        <p class="stock" [class.out-of-stock]="product.syncedStock === 0">
          Stock: {{ product.syncedStock > 0 ? product.syncedStock : 'Out of Stock' }}
        </p>

        <mat-form-field appearance="fill" class="quantity-input">
          <mat-label>Quantity</mat-label>
          <input matInput type="number" [(ngModel)]="quantity" min="1" [max]="product.syncedStock" (change)="onQuantityChange()" />
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="addToCart()" [disabled]="product.syncedStock === 0 || quantity === 0">
          <mat-icon>add_shopping_cart</mat-icon> Add to Cart
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="suggestedProducts.length > 0" class="suggested-products-card">
    <mat-card-header>
      <mat-card-title>You might also like</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="product-grid">
        <app-product-card *ngFor="let suggestedProduct of suggestedProducts" [product]="suggestedProduct"></app-product-card>
      </div>
    </mat-card-content>
  </mat-card>

  <ng-template #loadingOrError>
    <mat-card class="product-detail-card">
      <mat-card-content>
        <p *ngIf="!product && !error">Loading product details...</p>
        <p *ngIf="error" class="error-message">{{ error }}</p>
      </mat-card-content>
    </mat-card>
  </ng-template>
</div>
