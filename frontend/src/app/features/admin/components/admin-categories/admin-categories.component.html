div class="admin-categories-container">
<mat-card>
    <mat-card-header>
        <mat-card-title>Manage Categories</mat-card-title>
        <button mat-raised-button color="primary" (click)="openCategoryDialog()">
            <mat-icon>add</mat-icon> Add New Category
        </button>
    </mat-card-header>
    <mat-card-content>
        <div class="filter-section">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Search Categories</mat-label>
                <input matInput [(ngModel)]="searchQuery" (keyup)="applyFilter()" placeholder="Search by name or description">
                <button mat-icon-button matSuffix *ngIf="searchQuery" (click)="clearSearch()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>

        <div class="table-container">
            <table mat-table [dataSource]="dataSource" matSort>
                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> Description </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container>

                <!-- Active Column -->
                <ng-container matColumnDef="active">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Active </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-slide-toggle
                                [checked]="element.active"
                                (change)="toggleCategoryStatus(element.id, $event.checked)">
                        </mat-slide-toggle>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="accent" (click)="openCategoryDialog(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteCategory(element.id)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>

<ng-container *ngIf="loading">
    <div class="loading-overlay">
        <mat-spinner></mat-spinner>
    </div>
</ng-container>
