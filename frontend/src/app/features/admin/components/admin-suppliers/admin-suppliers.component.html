<div class="admin-suppliers-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Manage Suppliers</mat-card-title>
      <button mat-raised-button color="primary" (click)="openSupplierDialog()">
        <mat-icon>add</mat-icon> Add New Supplier
      </button>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="filterForm" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Search Suppliers</mat-label>
          <input matInput formControlName="search" placeholder="Search by name or email">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Data Format</mat-label>
          <mat-select formControlName="dataFormat">
            <mat-option value="">All Formats</mat-option>
            <mat-option value="API">API</mat-option>
            <mat-option value="CSV">CSV</mat-option>
            <mat-option value="EXCEL">Excel</mat-option>
            <mat-option value="SOAP">SOAP</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-checkbox formControlName="active">Show Active Only</mat-checkbox>
        <div class="filter-actions">
          <button mat-raised-button color="primary" (click)="applyFilters()">Apply Filters</button>
          <button mat-button (click)="clearFilters()">Clear Filters</button>
        </div>
      </form>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)">
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Contact Email Column -->
          <ng-container matColumnDef="contactEmail">
            <th mat-header-cell *matHeaderCellDef> Contact Email </th>
            <td mat-cell *matCellDef="let element"> {{element.contactEmail}} </td>
          </ng-container>

          <!-- Data Format Column -->
          <ng-container matColumnDef="dataFormat">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Data Format </th>
            <td mat-cell *matCellDef="let element"> {{element.dataFormat}} </td>
          </ng-container>

          <!-- Active Column -->
          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Active </th>
            <td mat-cell *matCellDef="let element">
              <mat-slide-toggle
                [checked]="element.active"
                (change)="toggleSupplierStatus(element.id, $event.checked)">
              </mat-slide-toggle>
            </td>
          </ng-container>

          <!-- Last Import Column -->
          <ng-container matColumnDef="lastImport">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Import </th>
            <td mat-cell *matCellDef="let element"> {{element.lastImport | date:'short'}} </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="accent" (click)="openSupplierDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="primary" (click)="triggerImport(element.id)" matTooltip="Trigger Manual Import">
                <mat-icon>cloud_download</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteSupplier(element.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="totalElements"
                       [pageSize]="pageSize"
                       [pageSizeOptions]="[5, 10, 25, 100]"
                       (page)="onPageChange($event)"
                       aria-label="Select page of suppliers">
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
