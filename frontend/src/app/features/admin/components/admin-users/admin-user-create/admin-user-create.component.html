<div class="user-create-container">
  <mat-card class="user-create-card">
    <mat-card-header>
      <mat-card-title>Create New User</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required>
          <mat-error *ngIf="userForm.get('username')?.hasError('required') && userForm.get('username')?.touched">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" required>
          <mat-error *ngIf="userForm.get('email')?.hasError('required') && userForm.get('email')?.touched">
            Email is required
          </mat-error>
          <mat-error *ngIf="userForm.get('email')?.hasError('email') && userForm.get('email')?.touched">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-error *ngIf="userForm.get('password')?.hasError('required') && userForm.get('password')?.touched">
            Password is required
          </mat-error>
          <mat-error *ngIf="userForm.get('password')?.hasError('minlength') && userForm.get('password')?.touched">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role" required>
            <mat-option value="CLIENT">Client</mat-option>
            <mat-option value="ADMIN">Admin</mat-option>
          </mat-select>
          <mat-error *ngIf="userForm.get('role')?.hasError('required') && userForm.get('role')?.touched">
            Role is required
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button routerLink="/admin/users">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
            Create User
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
